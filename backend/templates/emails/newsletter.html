<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background-color:#F3F6FC; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F3F6FC; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px; background-color:#FFFFFF; border-radius:20px; overflow:hidden; box-shadow:0 12px 32px rgba(31,53,147,0.10);">

          <tr>
            <td style="height:6px; background:linear-gradient(90deg,#2F5CFF,#1B3FCC 55%,#B8873E 110%); background-color:#2F5CFF; font-size:0; line-height:0;">&nbsp;</td>
          </tr>

          <tr>
            <td style="padding:36px 40px 8px;">
              <span style="font-size:20px; font-weight:800; letter-spacing:0.03em; color:#10152B;">UNITARY <span style="color:#2F5CFF;">X</span></span>
            </td>
          </tr>

          <tr>
            <td style="padding:20px 40px 0;">
              <p style="margin:0 0 18px; font-size:22px; font-weight:800; color:#10152B; line-height:1.3;">{{ subject }}</p>
              {% for para in paragraphs_html %}
              <p style="margin:0 0 16px; font-size:15px; line-height:1.65; color:#4A5170; white-space:pre-line;">{{ para }}</p>
              {% endfor %}
            </td>
          </tr>

          {% if cta_label and cta_url %}
          <tr>
            <td style="padding:8px 40px 28px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#10152B" style="border-radius:999px;">
                    <a href="{{ cta_url }}" target="_blank" style="display:inline-block; padding:14px 30px; font-size:14px; font-weight:700; color:#FFFFFF; text-decoration:none; border-radius:999px;">{{ cta_label }} &rarr;</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          {% endif %}

          <tr>
            <td style="padding:0 40px;">
              <div style="border-top:1px solid #EAF0FA;"></div>
            </td>
          </tr>

          <tr>
            <td style="padding:24px 40px 36px;">
              <p style="margin:0 0 8px; font-size:13px; color:#8890AC; line-height:1.6;">&mdash; The Unitary X Team</p>
              <p style="margin:0; font-size:12px; color:#8890AC; line-height:1.6;">{{ footer }} <a href="{{ unsubscribe_url }}" style="color:#8890AC; text-decoration:underline;">{{ unsubscribe_label }}</a></p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
